<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="title">SITTA</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/toast.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
</head>

<body>

    <!-- HEADER -->
    <header class="main-header">
        <nav class="container nav-wrapper">
            <div class="logo">
                <h1>SITTA</h1>
            </div>
            <ul class="nav-menu" id="nav-menu">
                <li>
                    <a href="index.html" class="nav-link">
                        <i class="bx bx-home"></i><span>Home</span>
                    </a>
                </li>
                <li>
                    <a href="bahan-ajar.html" class="nav-link">
                        <i class="bx bx-library"></i><span>Bahan Ajar</span>
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link">
                        <i class="bx bx-map-pin"></i><span>Tracking</span>
                    </a>
                </li>
                <li class="dropdown-wrapper">
                    <a href="#" class="nav-link">
                        <i class='bx bx-bar-chart-alt-2'></i>
                        Laporan <i class='bx bx-chevron-down'></i>
                    </a>
                    <div class="dropdown-box">
                        <a href="#">Monitoring Progress DO Bahan Ajar</a>
                        <a href="#">Rekap Bahan Ajar</a>
                    </div>
                </li>
                <li>
                    <a href="#" class="nav-link">
                        <i class="bx bx-transfer"></i><span>Transaksi</span>
                    </a>
                </li>
                <li>
                    <a href="login.html" class="nav-link hidden log-in">
                        <i class="bx bx-user"></i><span>Sign In</span>
                    </a>
                    <a href="#" onclick="logout(event)" class="nav-link hidden log-out">
                        <i class="bx bx-power-off"></i><span>Logout</span>
                    </a>
                </li>
            </ul>

            <div class="nav-actions">
                <button class="icon-btn hidden log-in" onclick="sign(event)"><i class='bx bx-user-circle'></i></button>
                <button class="icon-btn hidden log-out" onclick="logout(event)"><i class='bx bx-power-off'></i></button>
            </div>
        </nav>
    </header>
    <!-- END HEADER -->

    <!-- CONTENT -->
    <main class="container">


        <section class="search-section">
            <div class="search-wrapper">
                <i class="bx bx-search"></i>
                <input type="text" onkeyup="cariData(this.value)" placeholder="Ketik nama bahan ajar atau kode barang">
            </div>
        </section>



        <section class="list-section">
            <div class="section-header">
                <h3>Bahan Ajar</h3>
            </div>
            <div class="book-list bahan-ajar-latest">

            </div>


            <div id="pagination-controls" class="pagination-flex">

            </div>
        </section>
    </main>
    <!-- END CONTENT -->

    <nav class="mobile-bottom-nav">
        <a href="index.html" class="nav-item">
            <i class='bx bx-home'></i>
            <span>Home</span>
        </a>
        <a href="bahan-ajar.html" class="nav-item">
            <i class='bx bx-library'></i>
            <span>Bahan Ajar</span>
        </a>
        <a href="#" class="nav-item">
            <i class='bx bx-map-pin'></i>
            <span>Tracking</span>
        </a>
        <a href="javascript:void(0)" class="nav-item" onclick="toggleLaporanMenu()">
            <i class='bx bx-line-chart'></i>
            <span>Laporan</span>
        </a>
        <a href="#" class="nav-item">
            <i class='bx bx-transfer'></i>
            <span>Transaksi</span>
        </a>
    </nav>

    <div class="mobile-overlay" id="laporan-overlay">
        <div class="overlay-content">
            <div class="overlay-body">
                <a href="#"><i class='bx bx-search-alt'></i> Monitoring Progress DO</a>
                <a href="#"><i class='bx bx-file'></i> Rekap Bahan Ajar</a>
            </div>
        </div>
    </div>


    <div class="toast-container" id="toastContainer">

    </div>

    <script src="js/data.js"></script>
    <script src="js/database.js"></script>
    <script src="js/script.js"></script>
    <script src="js/stok.js"></script>


</body>

</html>
