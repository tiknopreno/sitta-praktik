<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - SITTA UT</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/toast.css">
</head>

<body>

    <main class="login-container">
        <section class="login-card">
            <header class="login-header">
                <div class="logo-wrapper">
                    <img src="img/logo.png" alt="App Logo" class="app-logo">
                </div>
                <h1>Silahkan masuk</h1>
                <p>Aplikasi Pemesanan Bahan Ajar Digtial</p>
            </header>
            <form onsubmit="handleLogin(event)" class="login-form">
                <div class="input-group">
                    <label for="email" class="visually-hidden">Email</label>
                    <input type="email" onblur="checkEmail(event)" data-validasi-text="login-email" name="email" id="emailLogin" placeholder="Email" required>
                    <small id="login-email">
                        
                    </small>
                </div>
                <div class="input-group">
                    <label for="password" class="visually-hidden">Password</label>
                    <div class="password-wrapper">
                        <input type="password" name="password" id="password-login" placeholder="Password" required>
                        <button type="button" class="toggle-password" data-target="password-login">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-eye">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Masuk</button>
            </form>
            <footer class="login-footer">
                <p>Lupas password?</p> <a href="#" data-open="reset-modal">Reset</a>
                <p>Beleum punya akun?</p> <a href="#" data-open="daftar-modal">Daftar</a>
            </footer>
        </section>
    </main>

    <!-- TOAST -->
    <div class="toast-container" id="toastContainer">

    </div>

    <!-- MODAL -->

    <div id="reset-modal" class="modal-overlay">
        <div class="modal-content">
            <button id="close-modal" class="close-btn">&times;</button>
            <header class="login-header">
                <h1>Lupa Password</h1>
                <p>Aplikasi Pemesanan Bahan Ajar Digtial</p>
            </header>

            <form class="login-form">

                <div class="input-group">
                    <label for="email" class="visually-hidden">Email</label>
                    <input type="email" name="email" id="emailLogin" data-validasi-text="reset-password" onblur="checkEmail(event)" placeholder="Masukan email" required>
                    <small id="reset-password">
                        
                    </small>
                </div>




                <button type="submit" class="btn-submit">Daftar</button>
            </form>
        </div>
    </div>


    <div id="daftar-modal" class="modal-overlay">
        <div class="modal-content">
            <button id="close-modal" class="close-btn">&times;</button>
            <header class="login-header">
                <h1>Daftar akun</h1>
                <p>Aplikasi Pemesanan Bahan Ajar Digtial</p>
            </header>

            <form class="login-form">
                <div class="input-group">
                    <label for="fullaname" class="visually-hidden">Nama Lengkap</label>
                    <input type="text" name="fullname" id="fullname" placeholder="Nama lengkap" required>
                </div>
                <div class="input-group">
                    <label for="fullaname" class="visually-hidden">Handphone</label>
                    <input type="text" name="nohp" id="fullname" placeholder="Nomor telepon" required>
                </div>
                <div class="input-group">
                    <label for="email" class="visually-hidden">Email</label>
                    <input type="email" name="email" id="email" onblur="checkEmail(event)" data-validasi-text="email-daftar-akun" placeholder="Masukan email" required>
                    <small id="email-daftar-akun">
                        
                    </small>
                </div>
                <div class="input-group">
                    <label for="password" class="visually-hidden">Password</label>
                    <div class="password-wrapper">
                        <input type="password" name="password" id="password-daftar" placeholder="Masukan password"
                            required>
                        <button type="button" class="toggle-password" data-target="password-daftar">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-eye">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="input-group">
                    <label for="password" class="visually-hidden">Ulangi password</label>
                    <div class="password-wrapper">
                        <input type="password" name="repassword" id="repassword-daftar" placeholder="Ulangi password"
                            required>
                        <button type="button" class="toggle-password" data-target="repassword-daftar">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-eye">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Daftar</button>
            </form>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
